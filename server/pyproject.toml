[project]
name = "server"
version = "0.1.0"
description = "Mango variety identification prediction API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.118.0",
    "httpx>=0.28.1",
    "numpy>=2.3.3",
    "onnxruntime>=1.20.0",
    "pillow>=11.3.0",
    "pydantic-settings>=2.11.0",
    "python-multipart>=0.0.20",
    "torch>=2.4.0",
    "transformers>=4.45.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

