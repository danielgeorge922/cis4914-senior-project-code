[project]
name = "ml-models"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "datasets>=4.1.1",
    "filelock>=4.0.4",
    "google-genai>=2.25.0",
    "httpx>=0.28.1",
    "huggingface-hub>=2.0.0",
    "matplotlib>=3.9.4",
    "numpy>=2.5.3",
    "onnx>=1.23.2",
    "onnxscript>=0.7.2",
    "pandas>=2.3.3",
    "pillow>=11.3.0",
    "pillow-heif>=1.1.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "seaborn>=0.13.2",
    "torch>=2.8.0",
    "torchvision>=0.23.0",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
]

[project.scripts]
ml-models = "ml_models:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "pytesseract>=0.3.13",
    "pytest>=8.4.2",
]
